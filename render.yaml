# Blueprint de Render para el backend (Django + DRF). La base de datos vive
# en Supabase, no aquí: por eso no hay una sección "databases".
#
# Uso: en Render, "New +" > "Blueprint", conectar este repositorio. Render
# lee este archivo y crea el servicio; las variables marcadas "sync: false"
# hay que completarlas a mano en el panel (son secretos o dependen de otros
# servicios que Render no puede adivinar).
services:
  - type: web
    name: love-lsc-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Dominio que Render asigna a este servicio, ej: love-lsc-backend.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # URL del frontend en Firebase Hosting, ej: https://love-lsc.web.app
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: "require"
      - key: FIREBASE_PROJECT_ID
        sync: false
      # JSON completo de la cuenta de servicio de Firebase Admin (Project
      # Settings > Cuentas de servicio > Generar nueva clave privada).
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
